package:
  name: qt6-positioning-uibcdf
  version: "6.10.1"

source:
  git_url: https://github.com/qt/qtpositioning.git
  git_rev: 11d336c178adf4b8d8f7f8589bb9641bcf4b8eda

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - qt6-main =6.10.1
    - libgl-devel
    - libegl-devel
  run:
    - qt6-main =6.10.1
    - libgcc
    - libstdcxx

test:
  requires:
    - python =3.14
  commands:
    - test -f "$PREFIX/lib/libQt6Positioning.so.6"
    - test -f "$PREFIX/lib/libQt6PositioningQuick.so.6"
    - test -f "$PREFIX/lib/qt6/qml/QtPositioning/libpositioningquickplugin.so"
    - test -f "$PREFIX/include/qt6/QtPositioning/qgeopositioninfo.h"
    - test -f "$PREFIX/lib/cmake/Qt6Positioning/Qt6PositioningConfig.cmake"
    - python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib/libQt6Positioning.so.6'))"
    - python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib/libQt6PositioningQuick.so.6'))"

about:
  summary: "Experimental UIBCDF Qt Positioning 6.10.1 runtime for Linux."
  license: "LGPL-3.0-only"
  description: |
    Experimental conda package for the Qt Positioning runtime layer required by
    the provisional UIBCDF standalone Qt-for-Python family.

extra:
  recipe-maintainers:
    - uibcdf
